<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefineAI - Complete Payment</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #FF8C00;
            --bg: #0F172A;
            --text: #F8FAFC;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 24px;
        }

        .status {
            font-size: 1.2rem;
            margin-bottom: 16px;
        }

        .loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 140, 0, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 0.9rem;
            color: #94A3B8;
            margin-top: 16px;
        }

        .success {
            color: #22C55E;
        }

        .error {
            color: #EF4444;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .btn:hover {
            background: #E67E00;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">RefineAI</div>
        <div id="status" class="status">Initializing payment...</div>
        <div id="loader" class="loader"></div>
        <div id="message" class="message"></div>
    </div>

    <script>
        // Configuration
        const SUPABASE_URL = 'https://sizvcdcdcrodxyfbqkau.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpenZjZGNkY3JvZHh5ZmJxa2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDcwODYsImV4cCI6MjA5NjgyMzA4Nn0.26EVSOXBzn8XfsNYefz1LpUvQkL5p70dKpYDePa3mGI';
        const RAZORPAY_KEY_ID = 'rzp_test_S9nAMfVpQl4RuF';

        const PLANS = {
            pro: { amount: 199, name: 'Pro Plan', description: '20,000 words per day' },
            premium: { amount: 499, name: 'Premium Plan', description: 'Unlimited words' }
        };

        // Elements
        const statusEl = document.getElementById('status');
        const loaderEl = document.getElementById('loader');
        const messageEl = document.getElementById('message');
        const containerEl = document.querySelector('.container');

        // Parse URL params
        const params = new URLSearchParams(window.location.search);
        const planType = params.get('plan');
        const userId = params.get('user_id');
        const userEmail = params.get('email');
        const userName = params.get('name') || '';

        // Initialize Supabase
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showStatus(text, type = 'info') {
            statusEl.textContent = text;
            statusEl.className = 'status ' + type;
        }

        function showMessage(text) {
            messageEl.textContent = text;
        }

        function hideLoader() {
            loaderEl.style.display = 'none';
        }

        function showCloseButton() {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.textContent = 'Close Window';
            btn.onclick = () => window.close();
            containerEl.appendChild(btn);
        }

        async function createOrder() {
            const plan = PLANS[planType];

            const response = await fetch(`${SUPABASE_URL}/functions/v1/razorpay-payment`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                },
                body: JSON.stringify({
                    action: 'create_order',
                    amount: plan.amount,
                    currency: 'INR',
                    plan_type: planType,
                    user_id: userId,
                    user_email: userEmail
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Failed to create order');
            }

            return data;
        }

        async function verifyPayment(paymentData) {
            const response = await fetch(`${SUPABASE_URL}/functions/v1/razorpay-payment`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                },
                body: JSON.stringify({
                    action: 'verify_payment',
                    razorpay_order_id: paymentData.razorpay_order_id,
                    razorpay_payment_id: paymentData.razorpay_payment_id,
                    razorpay_signature: paymentData.razorpay_signature,
                    user_id: userId,
                    plan_type: planType
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Payment verification failed');
            }

            return data;
        }

        async function initPayment() {
            // Validate params
            if (!planType || !userId || !userEmail) {
                showStatus('Invalid payment request', 'error');
                showMessage('Missing required parameters. Please try again from the extension.');
                hideLoader();
                showCloseButton();
                return;
            }

            if (!PLANS[planType]) {
                showStatus('Invalid plan selected', 'error');
                hideLoader();
                showCloseButton();
                return;
            }

            try {
                showStatus('Creating order...');
                const orderData = await createOrder();

                const plan = PLANS[planType];

                // Open Razorpay checkout
                const options = {
                    key: RAZORPAY_KEY_ID,
                    amount: orderData.amount,
                    currency: orderData.currency,
                    name: 'RefineAI',
                    description: `${plan.name} - ${plan.description}`,
                    order_id: orderData.order_id,
                    handler: async function (response) {
                        showStatus('Verifying payment...');
                        try {
                            await verifyPayment(response);
                            showStatus('🎉 Payment successful!', 'success');
                            showMessage('Your plan has been upgraded. You can close this window and refresh your extension.');
                            hideLoader();
                            showCloseButton();
                        } catch (err) {
                            showStatus('Verification failed', 'error');
                            showMessage('Payment was received but verification failed. Please contact support.');
                            hideLoader();
                            showCloseButton();
                        }
                    },
                    prefill: {
                        email: userEmail,
                        name: userName
                    },
                    theme: {
                        color: '#FF8C00'
                    },
                    modal: {
                        ondismiss: function () {
                            showStatus('Payment cancelled', 'error');
                            showMessage('You cancelled the payment. Close this window to try again.');
                            hideLoader();
                            showCloseButton();
                        }
                    }
                };

                hideLoader();
                showStatus('Opening payment window...');

                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function (response) {
                    showStatus('Payment failed', 'error');
                    showMessage(response.error.description);
                    showCloseButton();
                });
                rzp.open();

            } catch (err) {
                console.error('Payment error:', err);
                showStatus('Error', 'error');
                showMessage(err.message || 'Something went wrong. Please try again.');
                hideLoader();
                showCloseButton();
            }
        }

        // Start payment flow
        initPayment();
    </script>
</body>

</html>
